<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 | Page Not Found - Lucily</title>
  <link href="https://fonts.googleapis.com/css2?family=Luxurious+Script&display=swap" rel="stylesheet">
  <style>
    :root {
      --stroke: rgba(255, 255, 255, 0.18);
      --text: #f5f7ff;
      --muted: rgba(255, 255, 255, 0.75);
    }

    * { box-sizing: border-box; }

    html {
      scroll-behavior: smooth;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      margin: 0;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      color: var(--text);
      background: transparent;
      overflow-x: hidden;
    }
    
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background: linear-gradient(120deg, rgba(255,255,255,0.05), rgba(255,255,255,0.01), rgba(255,255,255,0.05));
      pointer-events: none;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .glass {
      background: rgba(255, 255, 255, 0.09);
      border: 1px solid var(--stroke);
      box-shadow: 0 8px 32px rgba(31, 38, 135, 0.2);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
    }

    .page-shell {
      max-width: 1200px;
      margin: 0 auto;
      padding: 32px 20px 80px;
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 10;
      margin-top: 20px;
      border-radius: 22px;
      padding: 14px 22px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }

    .brand-container {
      display: flex;
      align-items: baseline;
      gap: 12px;
    }

    .brand {
      font-family: 'Luxurious Script', cursive;
      font-size: 2.4rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      color: white;
    }

    .brand:hover {
      text-decoration: none;
    }

    .subtext {
      font-size: 0.9rem;
      font-weight: 400;
      letter-spacing: 0.06em;
      color: rgba(255, 255, 255, 0.7);
    }

    .subtext:hover {
      text-decoration: none;
      color: white;
    }

    .nav {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .nav a {
      padding: 10px 16px;
      border-radius: 999px;
      color: var(--muted);
      font-weight: 600;
      transition: 0.2s ease;
    }

    .nav a:hover {
      background: rgba(255,255,255,0.08);
      color: white;
    }

    .nav a.active {
      background: linear-gradient(135deg, rgba(142,197,252,0.18), rgba(224,195,252,0.18));
      color: white;
      border: 1px solid rgba(255,255,255,0.14);
    }

    .hero {
      margin-top: 42px;
      padding: 60px 28px;
      border-radius: 30px;
      position: relative;
      overflow: hidden;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .hero::after {
      content: "";
      position: absolute;
      right: -60px;
      top: -60px;
      width: 220px;
      height: 220px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255,255,255,0.24), transparent 60%);
      filter: blur(10px);
    }

    .error-code {
      font-size: clamp(5rem, 12vw, 9rem);
      font-weight: 900;
      line-height: 1;
      margin: 0;
      background: linear-gradient(135deg, #8ec5fc, #e0c3fc);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: -0.04em;
    }

    .kicker {
      display: inline-block;
      margin: 16px 0;
      padding: 8px 14px;
      border-radius: 999px;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.12);
      color: var(--muted);
      font-size: 0.85rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    h1 {
      margin: 10px 0 0;
      font-size: clamp(1.8rem, 3vw, 2.8rem);
      letter-spacing: -0.03em;
    }

    .hero p {
      margin: 18px 0 0;
      max-width: 550px;
      color: var(--muted);
      font-size: 1.05rem;
      line-height: 1.7;
    }

    .actions {
      margin-top: 32px;
      display: flex;
      gap: 14px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 14px 24px;
      border-radius: 16px;
      font-weight: 700;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      border: 1px solid var(--stroke);
    }

    .button:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 25px rgba(0,0,0,0.18);
    }

    .button.primary {
      background: linear-gradient(135deg, rgba(142,197,252,0.25), rgba(224,195,252,0.25));
      color: white;
    }

    @media (max-width: 700px) {
      .topbar {
        padding: 16px 18px;
        flex-direction: column;
        align-items: flex-start;
      }

      .nav { width: 100%; }
      .nav a { flex: 1 1 auto; text-align: center; }
      .hero { padding: 40px 20px; }
    }
  </style>
</head>
<body>
  <div class="page-shell">
    <header class="topbar glass">
      <div class="brand-container">
        <a href="/" class="brand">Lucily</a>
        <a href="/about/" class="subtext">by Ancient Kira</a>
      </div>
      <nav class="nav" aria-label="Main navigation">
        <a href="/">Home</a>
        <a href="/projects/">Projects</a>
        <a href="/about/">About</a>
      </nav>
    </header>

    <main>
      <section class="hero glass">
        <div class="error-code">404</div>
        <div class="kicker">Where am I?</div>
        <h1>This page is not available!</h1>
        <p>
          "The page you are looking for doesn't exist or was moved. But don't worry—less ads, more fun, so let's get you back on track!", a knight with full diamond armor says.
        </p>
        <div class="actions">
          <a class="button primary" href="/">Back to Home</a>
        </div>
      </section>
    </main>
  </div>
</body>
</html>
