  <script>
    function simpleMarkdown(text) {
      const html = [];
      let paragraph = [];
      let code = [];
      let inList = false;
      let inCodeBlock = false;
      const flushParagraph = () => {
        if (paragraph.length) {
          html.push('<p>' + formatInline(paragraph.join(' ')) + '</p>');
          paragraph = [];
        }
      };
      const closeList = () => {
        if (inList) { html.push('</ul>'); inList = false; }
      };
      const flushCode = () => {
        html.push('<pre><code>' + code.join('\n').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;') + '</code></pre>');
        code = [];
      };
      for (const line of text.split('\n')) {
        if (line.startsWith('```')) {
          if (inCodeBlock) { flushCode(); inCodeBlock = false; }
          else { flushParagraph(); closeList(); inCodeBlock = true; }
          continue;
        }
        if (inCodeBlock) { code.push(line); continue; }
        if (!line.trim()) { flushParagraph(); closeList(); continue; }
        if (/^#{1,3} /.test(line)) {
          flushParagraph(); closeList(); html.push(formatLine(line)); continue;
        }
        if (line.trim().startsWith('* ')) {
          flushParagraph();
          if (!inList) { html.push('<ul>'); inList = true; }
          html.push('<li>' + formatInline(line.trim().slice(2)) + '</li>');
          continue;
        }
        closeList(); paragraph.push(line.trim());
      }
      flushParagraph(); closeList();
      if (inCodeBlock) flushCode();
      return html.join('\n');
    }

    function formatInline(text) {
      return text
        .replace(/~~(.*?)~~/g, '<del>$1</del>')
        .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
        .replace(/\*(.*?)\*/g, '<em>$1</em>')
        .replace(/`(.*?)`/g, '<code>$1</code>')
        .replace(/\[(.*?)\]\((.*?)\)/g, '<a href="$2" target="_blank">$1</a>');
    }

    function formatLine(line) {
      if (line.startsWith('# ')) {
        let title = line.substring(2);
        return `<h1 id="${title.toLowerCase().replace(/[^\w]+/g, '-')}">${title}</h1>`;
      }
      if (line.startsWith('## ')) {
        let title = line.substring(3);
        return `<h2 id="${title.toLowerCase().replace(/[^\w]+/g, '-')}">${title}</h2>`;
      }
      if (line.startsWith('### ')) {
        let title = line.substring(4);
        return `<h3 id="${title.toLowerCase().replace(/[^\w]+/g, '-')}">${title}</h3>`;
      }
      return formatInline(line);
    }

    const myProjectText = `# Enable
Make sure to have MCArem 8.1.11+ installed!

One funny and useful feature of MCArem is the AI-based conversation. For privacy reasons, it is disabled by default. Enable it in the server config:
\`\`\`json
"enableVillagerChatAI": true,
\`\`\`
Or via command in the [command section](https://github.com/AncientKira21/mcarem/wiki/GPT3%E2%80%90based%E2%80%90conversations#commands-and-models).

Then, the AI waits until the player starts a conversation by saying the name of the villager out loud. E.g.
\`\`\`
Hi Ismahan, how are you?
\`\`\`
You do not need to care about lower/upper cases nor accents.

Once a conversation is started, you can talk without mentioning the name.

The AI is limited in terms of memory and environment. They know their personality, the players’ achievement and their approximate surroundings, but that's about it. Asking about how they like your house, for example, will result in fancy, but completely guessed responses. Same with memory, they only remember the last few a dozen sentences of your conversation.

To stop a conversation, leave.

**Do not share sensitive information and keep in mind that everything you say may be used for evaluation or training.**

# Increase Conversation Limit
"The AI is expensive and therefore rate-limited. Your quota is reset once an hour and is enough for chitchatting or a dialogue once in a while.
You can extend that limit:"
* ~~Head over to Conczin's donation page and select the \`Fund the AI\` pledge.~~ Our motto is *Less ads and payments, more fun*, so donation is optional for people who want to support. We do not give premium access tiers to keep things fun and fair.
* If you try using the old method where you support MCAR's devs just to get a premium tier, it WILL NOT WORK. Just delete the mod and use MCAR instead if you love those devs too much. MCArem and MCAR are like Apple and Samsung, they share displays, but they're rivals, but instead of displays, they share the AI and library. But doesn't mean you can't support them. Support them and me if you want. It's up to you, the choice is yours!

In conclusion, there is no way to extend that limit.

# Commands and Models
You can use the \`/mca chatAI default\` command to turn on the AI and toggle between models using \`/mca chatAI <model>\`.
Models have different characteristics, intelligence and price.
I recommend sticking to the default from one of the providers here:
* \`default\` - An alias for the recommended model.
* \`mistral\` - The recommended model provided by Mistral.AI
* \`openai\` - The recommended model provided by OpenAI
* \`groq\` - The recommended model provided by Groq
* \`horde\` - A random >7B model from the [AI Horde](https://aihorde.net/). Crowdsourced!
* \`player2\` - Use [Player2](https://player2.game/)'s backend.

# Long-term Memory

The default server comes with a experimental Long-term memory (8.1.11+), it is disabled by default. Turn it on in the config via \`villagerChatAIUseLongTermMemory\`, and optionally server-wide as well with \`villagerChatAIUseSharedLongTermMemory\`.
A compressed version of your dialogues is stored on the server!

# TTS

[Check this!](https://github.com/Luke100000/minecraft-comes-alive/wiki/TTS)

# Custom Endpoints
Advanced usage!
You can also provide your own endpoint and, when required, access token. For example (quote the URL!)

* \`/mca chatAI gpt-3.5-turbo "[https://api.openai.com/v1/chat/completions](https://api.openai.com/v1/chat/completions)" "secret_key"\`
* \`/mca chatAI mistral-small "[https://api.mistral.ai/v1/chat/completions](https://api.mistral.ai/v1/chat/completions)" "secret_key"\`

The token is sent to and stored on the server, do not execute that on untrusted servers!

You may want to provide an additional, custom system prompt in the config \`villagerChatAISystemPrompt\`.`;
